name: Update climbing conditions

on:
  schedule:
    # :07 and :37 past every hour - offset from :00/:30 to avoid GitHub's
    # top-of-hour scheduling congestion.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'data/spots.json'

permissions:
  contents: write

concurrency:
  group: update-conditions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch weather and compute CCS
        run: node scripts/update-conditions.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conditions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update climbing conditions [skip ci]"
            git push
          fi
